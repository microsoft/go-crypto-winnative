name: Benchmark

on:
  pull_request:
    paths-ignore:
      - '.github/**'
  workflow_dispatch:
    inputs:
      base-ref:
        description: 'Base ref to compare against (branch, tag, or SHA)'
        required: true
        default: 'main'

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    uses: microsoft/go-infra/.github/workflows/benchmark.yml@d38578e09d4278d489388a659d65cc5c0ba6063b # v0.0.18
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      default-base-ref: main
      dispatch-base-ref: ${{ inputs.base-ref }}
      # Cross product of runs-on × go-version × fips-mode, with an `include`
      matrix: |
        {
          "runs-on": ["windows-2022", "windows-2025", "windows-11-arm"],
          "go-version": ["1.26", "1.27"],
          "fips-mode": ["0", "1"],
        }
